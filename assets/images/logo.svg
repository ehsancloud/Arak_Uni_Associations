<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .stroke-dark { fill: none; stroke: #0f2042; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-white { fill: none; stroke: #ffffff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Diamond border with rounded vertices -->
  <rect x="18" y="18" width="64" height="64" rx="10" transform="rotate(45 50 50)" class="stroke-dark" />
  <rect x="24" y="24" width="52" height="52" rx="6" transform="rotate(45 50 50)" class="stroke-dark" stroke-width="1.8" opacity="0.5" />
  <!-- Tree trunk and branches -->
  <line x1="50" y1="78" x2="50" y2="22" class="stroke-dark" stroke-width="4" />
  <!-- Lower branches -->
  <path d="M50 64 L34 50 L34 42" class="stroke-dark" />
  <path d="M50 64 L66 50 L66 42" class="stroke-dark" />
  <!-- Middle branches -->
  <path d="M50 50 L36 38 L36 32" class="stroke-dark" />
  <path d="M50 50 L64 38 L64 32" class="stroke-dark" />
  <!-- Top branches -->
  <path d="M50 36 L42 28" class="stroke-dark" />
  <path d="M50 36 L58 28" class="stroke-dark" />
</svg>